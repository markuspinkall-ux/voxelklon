app-id: org.creativecraft.CreativeCraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: creative-craft
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=all          # GPU (Vulkan/OpenGL) und Gamepads
modules:
  - name: creative-craft
    buildsystem: simple
    build-commands:
      - install -Dm755 CreativeCraft.x86_64 /app/lib/creative-craft/CreativeCraft.x86_64
      - install -Dm644 CreativeCraft.pck /app/lib/creative-craft/CreativeCraft.pck
      - install -Dm755 creative-craft.sh /app/bin/creative-craft
      - for s in 32 48 64 128 256 512; do install -Dm644 icon-$s.png /app/share/icons/hicolor/${s}x${s}/apps/org.creativecraft.CreativeCraft.png; done
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/org.creativecraft.CreativeCraft.svg
      - install -Dm644 org.creativecraft.CreativeCraft.desktop /app/share/applications/org.creativecraft.CreativeCraft.desktop
      - desktop-file-validate /app/share/applications/org.creativecraft.CreativeCraft.desktop
      - install -Dm644 org.creativecraft.CreativeCraft.metainfo.xml /app/share/metainfo/org.creativecraft.CreativeCraft.metainfo.xml
    sources:
      - type: file
        path: ../build/linux/CreativeCraft.x86_64
      - type: file
        path: ../build/linux/CreativeCraft.pck
      - type: file
        path: creative-craft.sh
      - type: dir
        path: ../icons
      - type: file
        path: ../icon.svg
      - type: file
        path: org.creativecraft.CreativeCraft.desktop
      - type: file
        path: org.creativecraft.CreativeCraft.metainfo.xml
